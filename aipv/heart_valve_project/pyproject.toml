[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aipv-heart-valve-project"
version = "0.1.0"
description = "Reproducible valvebench ML benchmark system for synthetic heart valve data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.3",
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
]

[project.scripts]
valvebench = "valvebench.cli:main"

[project.optional-dependencies]
extra = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["valvebench*"]
