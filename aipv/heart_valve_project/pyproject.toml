[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aipv-heart-valve-project"
version = "0.1.0"
description = "Reproducible valvebench ML benchmark system for synthetic heart valve data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.3",
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
    "joblib==1.5.3",
]

[project.scripts]
valvebench = "valvebench.cli:main"

[project.optional-dependencies]
extra = ["pytest==9.0.3"]
# PINNVALVE's neural models are lazy-imported so the rest of the package
# works without torch installed; install this extra to train/run them.
pinn = ["torch>=2.2"]
# valvebench.datasets.imaging (MMWHS/ImageCHD/SegTHOR NIfTI loaders, NIH-3D
# STL loader) lazy-imports nibabel/trimesh; install this extra to use them.
imaging = ["nibabel>=5", "trimesh>=4"]
# valvebench.evaluation.plots lazy-imports matplotlib; install this extra to
# generate figures.
viz = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["valvebench*"]
